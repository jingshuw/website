<article class="publication-row">
  <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
  <p class="publication-authors">{{ partial "page_metadata_authors" . }} ({{ .Date.Year }}).</p>
  {{ with .Params.publication_short | default .Params.publication }}
    <p class="publication-venue">{{ . | markdownify }}</p>
  {{ end }}
  <div class="publication-links">{{ partial "page_links" (dict "page" . "is_list" 1) }}</div>
</article>
